version: '3.8'

services:
  mariadb:
    image: mariadb:11.4
    container_name: market-intelligence-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_password_only
      MYSQL_DATABASE: market_intelligence
      MYSQL_USER: market_user
      MYSQL_PASSWORD: market_secure_pass_123
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: market-intelligence-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  mariadb_data:
  redis_data:

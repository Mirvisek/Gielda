# ==============================================================================
# NGINX PRODUCTION REVERSE PROXY CONFIGURATION — BARE-METAL VPS
# ==============================================================================
# Ścieżka docelowa na VPS: /etc/nginx/sites-available/app.twojadomena.pl
# Aktywacja: ln -s /etc/nginx/sites-available/app.twojadomena.pl /etc/nginx/sites-enabled/
# Test: sudo nginx -t && sudo systemctl reload nginx

# 1. Definicja puli upstream z keepalive dla minimalnych opóźnień połączeń lokalnych
upstream next_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

# 2. Strefy Rate Limitingu (ochrona przed brute-force, DoS i nadmiernym wywoływaniem API)
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=trigger_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

# 3. Przekierowanie nieszyfrowanego ruchu HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name app.twojadomena.pl;

    # Wyzwania certyfikacyjne ACME Let's Encrypt (Certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 4. Główny bezpieczny serwer HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.twojadomena.pl;

    # Ścieżki certyfikatów SSL Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/app.twojadomena.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.twojadomena.pl/privkey.pem;

    # Nowoczesne parametry SSL/TLS zgodne z rekomendacją Mozilla Intermediate
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Nagłówki bezpieczeństwa HTTP
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Ograniczenie rozmiaru żądań (ochrona pamięci serwera)
    client_max_body_size 10M;

    # Kompresja Gzip dla szybkiego ładowania na urządzeniach mobilnych
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # --- PWA SERVICE WORKER (BEZWZGLĘDNY ZAKAZ CACHOWANIA PRZEGLĄDARKI) ---
    location ~* ^/(sw\.js|manifest\.webmanifest|manifest\.json)$ {
        proxy_pass http://next_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
    }

    # --- STATYCZNE ZASOBY NEXT.JS (DŁUGOTERMINOWY IMMUTABLE CACHE) ---
    location /_next/static/ {
        proxy_pass http://next_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        
        access_log off;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- ZASOBY STATYCZNE / PUBLIC ---
    location ~* \.(ico|jpg|jpeg|png|gif|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://next_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # --- OCHRONA ENDPOINTÓW LOGOWANIA / AUTORYZACJI PRZED BRUTE FORCE ---
    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://next_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- OCHRONA TRIGGERÓW WEBPUSH I RĘCZNEJ EWALUACJI ---
    location ~* ^/api/(push/test|alerts/evaluate) {
        limit_req zone=trigger_limit burst=3 nodelay;
        proxy_pass http://next_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- GŁÓWNY PROXY DO INSTANCJI NEXT.JS ---
    location / {
        limit_req zone=general_limit burst=50 nodelay;
        proxy_pass http://next_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

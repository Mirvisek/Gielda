# ==============================================================================
# NGINX REVERSE PROXY CONFIGURATION — MARKET INTELLIGENCE
# ==============================================================================
# Ścieżka docelowa na VPS: /etc/nginx/sites-available/app.twojadomena.pl
# Link symboliczny: ln -s /etc/nginx/sites-available/app.twojadomena.pl /etc/nginx/sites-enabled/

# Rate limiting strefa chroniąca przed atakami DDoS i Brute Force
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

# 1. Przekierowanie całego ruchu HTTP na HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name app.twojadomena.pl;

    # Obsługa wyzwań certyfikatu Let's Encrypt Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Główny serwer HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.twojadomena.pl;

    # Certyfikaty Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/app.twojadomena.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.twojadomena.pl/privkey.pem;

    # Nowoczesne parametry SSL/TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Nagłówki bezpieczeństwa HTTP
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Ochrona tras uwierzytelniania przed brute-force
    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Główny ruch kierowany do instancji Next.js na localhost
    location / {
        limit_req zone=general_limit burst=50 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

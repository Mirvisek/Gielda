# ==============================================================================
# NGINX VHOST DLA DOMENY: gielda.dygdon.xyz
# ==============================================================================
# Ścieżka na VPS: /etc/nginx/sites-available/gielda.dygdon.xyz
# Aktywacja: sudo ln -s /etc/nginx/sites-available/gielda.dygdon.xyz /etc/nginx/sites-enabled/
# Test: sudo nginx -t && sudo systemctl reload nginx

# 1. Dedykowana pula upstream z keepalive (działa na porcie 3000 lub innym skonfigurowanym w .env)
upstream gielda_next_upstream {
    server 127.0.0.1:3005;
    keepalive 64;
}

# 2. Bezpieczne strefy Rate Limitingu z unikalnym prefiksem gielda_ (nie kolidują z innymi stronami na serwerze)
limit_req_zone $binary_remote_addr zone=gielda_auth_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=gielda_trigger_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=gielda_general_limit:10m rate=30r/s;

# 3. HTTP -> Przekierowanie na HTTPS (Certbot automatycznie uzupełni lub zaktualizuje ten blok)
server {
    listen 80;
    listen [::]:80;
    server_name gielda.dygdon.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 4. Główny bezpieczny serwer HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gielda.dygdon.xyz;

    # Certyfikaty wygenerowane przez Certbot
    ssl_certificate /etc/letsencrypt/live/gielda.dygdon.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gielda.dygdon.xyz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:GieldaSSL:10m;
    ssl_session_tickets off;

    # Nagłówki bezpieczeństwa HTTP
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Limit wielkości uploadu
    client_max_body_size 10M;

    # Kompresja Gzip dla szybszego renderowania PWA
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # --- PWA SERVICE WORKER (BEZWZGLĘDNY BRAK CACHE W PRZEGLĄDARCE) ---
    location ~* ^/(sw\.js|manifest\.webmanifest|manifest\.json)$ {
        proxy_pass http://gielda_next_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
    }

    # --- PAKIETY STATYCZNE NEXT.JS (CACHE IMMUTABLE NA 1 ROK) ---
    location /_next/static/ {
        proxy_pass http://gielda_next_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        access_log off;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- ZASOBY GRAFICZNE / PUBLIC ---
    location ~* \.(ico|jpg|jpeg|png|gif|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://gielda_next_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # --- OCHRONA TRAS LOGOWANIA PRZED BRUTE FORCE ---
    location /api/auth/ {
        limit_req zone=gielda_auth_limit burst=5 nodelay;
        proxy_pass http://gielda_next_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- RATE LIMIT DLA PUSH TEST I RĘCZNEJ EWALUACJI ---
    location ~* ^/api/(push/test|alerts/evaluate) {
        limit_req zone=gielda_trigger_limit burst=3 nodelay;
        proxy_pass http://gielda_next_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- GŁÓWNA OBSŁUGA APLIKACJI NEXT.JS ---
    location / {
        limit_req zone=gielda_general_limit burst=50 nodelay;
        proxy_pass http://gielda_next_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
